x-app-env: &app-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/secyourflow
  REDIS_URL: redis://redis:6379
  NEXTAUTH_URL: http://localhost:3000

services:
  # One-shot schema migration. Everything else waits for it to exit 0.
  migrate:
    build:
      context: .
      target: migrate
    environment: *app-env
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [secyourflow]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment: *app-env
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [secyourflow]

  # Background job processor. Scale independently of web:
  #   docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment: *app-env
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [secyourflow]

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    # Bound to loopback so `npm run dev` on the host can use the same compose
    # services without exposing the database on public network interfaces.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secyourflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secyourflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [secyourflow]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [secyourflow]

networks:
  secyourflow:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
